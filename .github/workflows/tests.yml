name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: PHP ${{ matrix.php }} / Laravel ${{ matrix.laravel }} / predis
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 63799:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    strategy:
      fail-fast: false
      matrix:
        # Spelled out rather than built from a product: Laravel 13 needs
        # PHP 8.3, and each Laravel major has exactly one Testbench major.
        include:
          - { php: '8.2', laravel: '12', testbench: '^10.0' }
          - { php: '8.3', laravel: '12', testbench: '^10.0' }
          - { php: '8.4', laravel: '12', testbench: '^10.0' }
          - { php: '8.3', laravel: '13', testbench: '^11.0' }
          - { php: '8.4', laravel: '13', testbench: '^11.0' }
          - { php: '8.5', laravel: '13', testbench: '^11.0' }

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none

      - name: Install dependencies
        run: |
          composer require --dev --no-interaction --no-update \
            "laravel/framework:^${{ matrix.laravel }}.0" \
            "orchestra/testbench:${{ matrix.testbench }}"
          composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        run: vendor/bin/phpunit

  test-phpredis:
    name: phpredis client
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 63799:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v7

      # The two Redis clients disagree about key prefixing, variadic
      # arguments and SCAN, so the suite runs against both.
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: redis
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Run tests
        env:
          REDIS_CLIENT: phpredis
        run: vendor/bin/phpunit

  lint:
    name: code style
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          coverage: none

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Check code style
        run: vendor/bin/pint --test
